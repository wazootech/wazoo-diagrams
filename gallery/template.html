<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wazoo Diagrams</title>
    <meta
      name="description"
      content="Hand-inked, interactive diagrams explaining how Wazoo works."
    />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f2efe7;
        --panel: #fbf9f3;
        --rule: #ddd6c8;
        --ink: #231e16;
        --muted: #857d6e;
        --accent: #5a82c6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1d1b17;
          --panel: #26231e;
          --rule: #3a352d;
          --ink: #f2efe7;
          --muted: #a89f8e;
          --accent: #76a0e2;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header.page,
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 16px;
      }
      header.page {
        padding-top: 56px;
        padding-bottom: 8px;
      }
      header.page h1 {
        margin: 0 0 6px;
        font-size: 26px;
      }
      header.page p {
        margin: 0;
        color: var(--muted);
        max-width: 64ch;
      }
      main {
        padding-bottom: 72px;
      }
      .group h2 {
        margin: 40px 0 14px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1.5px solid var(--ink);
        border-radius: 12px;
        box-shadow: 3px 3px 0 var(--ink);
        padding: 18px 20px;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      .card a {
        color: inherit;
      }
      .card a.open {
        text-decoration: none;
      }
      .card a.open:hover h3 {
        color: var(--accent);
      }
      .blurb {
        margin: 0 0 10px;
        color: var(--muted);
      }
      .prompt summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .prompt p {
        margin: 8px 0 0;
        font-size: 13px;
      }
      .links {
        margin: 12px 0 0;
      }
      .empty {
        color: var(--muted);
      }
      footer {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 16px 40px;
        color: var(--muted);
        font-size: 12px;
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <header class="page">
      <h1>Wazoo Diagrams</h1>
      <p>
        Hand-inked, interactive diagrams explaining how Wazoo works. Each one is a
        small machine you can press: <!--COUNT--> so far.
      </p>
    </header>
    <main>
<!--FIGURES-->
    </main>
    <footer>
      Drawn with <a href="https://april-zhu.com/colorfigures">Colorfigures</a> by April Zhu (MIT).
      Source: <a href="https://github.com/wazootech/wazoo-diagrams">wazootech/wazoo-diagrams</a>.
    </footer>
  </body>
</html>
